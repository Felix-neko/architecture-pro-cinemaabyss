{{- if .Values.eventsService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: events-service
  namespace: {{ include "cinemaabyss.namespace" . }}
  labels:
    app: events-service
    app.kubernetes.io/name: {{ include "cinemaabyss.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.eventsService.replicas | default 1}}
  selector:
    matchLabels:
      app: events-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: events-service
        app.kubernetes.io/name: {{ include "cinemaabyss.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
      - name: events-service
        image: "{{ .Values.eventsService.image.repository }}:{{ .Values.eventsService.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.eventsService.image.pullPolicy | default "IfNotPresent" }}
        ports:
        - containerPort: {{ .Values.eventsService.service.targetPort | default 8082 }}
        env:
        - name: PORT
          value: "{{ .Values.eventsService.service.targetPort | default 8082 }}"
        - name: KAFKA_URL
          value: "kafka:9092"
        resources:
          {{- toYaml .Values.eventsService.resources | nindent 10 }}
        readinessProbe:
          httpGet:
            path: /api/events/health
            port: {{ .Values.eventsService.service.targetPort | default 8082 }}
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /api/events/health
            port: {{ .Values.eventsService.service.targetPort | default 8082 }}
          initialDelaySeconds: 20
          periodSeconds: 20
          failureThreshold: 3
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        - name: {{ .Values.imagePullSecrets }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: events-service
  namespace: {{ include "cinemaabyss.namespace" . }}
  labels:
    app: events-service
    app.kubernetes.io/name: {{ include "cinemaabyss.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    app: events-service
  ports:
  - port: {{ .Values.eventsService.service.port | default 8082 }}
    targetPort: {{ .Values.eventsService.service.targetPort | default 8082 }}
    protocol: TCP
  type: {{ .Values.eventsService.service.type | default "ClusterIP" }}
{{- end }}