version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:14
    container_name: cinemaabyss-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: cinemaabyss
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./src/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cinemaabyss-network

  # ZooKeeper for Kafka
  zookeeper:
    image: wurstmeister/zookeeper:latest
    container_name: cinemaabyss-zookeeper
    ports:
      - "2181:2181"
    networks:
      - cinemaabyss-network

  # Kafka
  kafka:
    image: wurstmeister/kafka:2.13-2.7.0
    container_name: cinemaabyss-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      # PLAINTEXT: для внутренних подключений, PLAINTEXT_HOST: для внешних
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CREATE_TOPICS: "movie-events:1:1,user-events:1:1,payment-events:1:1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - cinemaabyss-network

  # Monolith Service
  monolith:
    build:
      context: ./src/monolith
      dockerfile: Dockerfile
    container_name: cinemaabyss-monolith
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DB_CONNECTION_STRING: postgres://postgres:postgres_password@postgres:5432/cinemaabyss?sslmode=disable
    networks:
      - cinemaabyss-network

  # Movies Microservice
  movies-service:
    build:
      context: ./src/microservices/movies
      dockerfile: Dockerfile
    container_name: cinemaabyss-movies-service
    depends_on:
      - postgres
    ports:
      - "8081:8081"
    environment:
      PORT: 8081
      DB_CONNECTION_STRING: postgres://postgres:postgres_password@postgres:5432/cinemaabyss?sslmode=disable
    networks:
      - cinemaabyss-network

  # Events Microservice
  events-service:
    build:
      context: ./src/microservices/events
      dockerfile: Dockerfile
    container_name: cinemaabyss-events-service
    depends_on:
      - kafka
    ports:
      - "8082:8082"
    environment:
      HOST: "0.0.0.0"
      PORT: 8082
      KAFKA_URL: kafka:29092
    networks:
      - cinemaabyss-network

  kong:
    image: kong:3.9
    container_name: kong
    depends_on:
      - monolith
      - movies-service
      - events-service
    environment:
      # DB-less mode configuration
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_ADMIN_GUI_LISTEN: 0.0.0.0:8002
      KONG_ADMIN_GUI_URL: http://localhost:8002
      KONG_ANONYMOUS_REPORTS: false
      # Переменные для канареечного развертывания (автоматически используются в шаблоне)
      NEW_MOVIE_SERVICE_PERCENT: "${MOVIES_MIGRATION_PERCENT:-0}"
#       OLD_MOVIE_SERVICE_URL: "${OLD_MOVIE_SERVICE_URL:-http://old-movie-service:80}"
#       NEW_MOVIES_SERVICE_URL: "${NEW_MOVIES_SERVICE_URL:-http://new-movie-service:80}"
    ports:
      - "8000:8000"  # Proxy HTTP
      - "8443:8443"  # Proxy HTTPS
      - "8001:8001"  # Admin API
      - "8002:8002"  # Kong Manager OSS Web UI
      - "8444:8444"  # Admin API HTTPS
    volumes:
      - ./kong.yml.template:/etc/kong/kong.yml.template:ro  # Template file
      - ./kong-entrypoint.sh:/usr/local/bin/kong-entrypoint.sh:ro  # Custom entrypoint
      - ./canary-control.sh:/usr/local/bin/canary-control.sh:ro
    entrypoint: ["bash", "/usr/local/bin/kong-entrypoint.sh"]  # Use bash to execute the script
    networks:
      - cinemaabyss-network
    restart: unless-stopped
#     healthcheck:
#       test: ["CMD", "kong", "health"]
#       interval: 30s
#       timeout: 10s
#       retries: 5

  # Пример старого сервиса фильмов для тестирования
  old-movie-service:
    image: nginx:alpine
    container_name: old-movie-service
    ports:
      - "8201:80"  # Direct access to old movie service
    volumes:
      - ./old_movies_response.html:/usr/share/nginx/html/index.html:ro
    networks:
      - cinemaabyss-network
    restart: unless-stopped

  # Пример нового сервиса фильмов для тестирования
  new-movie-service:
    image: nginx:alpine
    container_name: new-movie-service
    ports:
      - "8202:80"  # Direct access to new movie service
    volumes:
      - ./new_movies_response.html:/usr/share/nginx/html/index.html:ro
    networks:
      - cinemaabyss-network
    restart: unless-stopped

